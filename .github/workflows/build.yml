name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Full App
        run: |
          # שמירת קובץ הקוד הראשי בצד
          cp lib/main.dart /tmp/main.dart

          # יצירת פרויקט Flutter מלא ותקני מאפס
          cd ..
          rm -rf interview-tracker
          flutter create --org com.interviewtracker --project-name interview_tracker interview-tracker
          cd interview-tracker

          # החזרת קובץ ה-Dart שלנו
          cp /tmp/main.dart lib/main.dart

          # הוספת הספריות הנחוצות ישירות לפרויקט
          flutter pub add intl shared_preferences url_launcher

          # בניית קובץ ה-APK
          flutter build apk --debug

          # העתקת ה-APK המוכן לתיקיית העבודה
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output/app-debug.apk
